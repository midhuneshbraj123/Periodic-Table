<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Periodic Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Simple Periodic Table</h1>
    <p>Click on any element card below to see more information.</p>

    <!-- Box where elements will appear -->
    <div id="table-box"></div>

    <!-- Info box to show element details -->
    <div id="info-box">
        <h2>Element Info</h2>
        <p id="details">Click an element to learn about it!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
